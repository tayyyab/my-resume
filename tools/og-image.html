<!doctype html>
<!-- Source for /assets/img/og-image.png (1200x630). Regenerate with: make og -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #07080a;
    color: #eef1ea;
    font-family: Inter, sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 30% 40%, #000 30%, transparent 80%);
  }
  .glow { position: absolute; right: -120px; top: -60px; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(212,255,63,.28), transparent 65%); }
  .wrap { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 26px "Space Grotesk"; }
  .mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: #d4ff3f; color: #0d1100; font-size: 20px; }
  .pill { margin: auto 0 0; align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 10px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; font-size: 19px; color: #a3aa9d; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
  h1 { margin: 22px 0 0; font: 600 76px/1.02 "Space Grotesk"; letter-spacing: -.035em; max-width: 880px; }
  h1 span { color: #d4ff3f; }
  .meta { margin-top: 30px; display: flex; gap: 14px; font: 500 20px "JetBrains Mono"; color: #a3aa9d; }
  .meta b { color: #eef1ea; font-weight: 500; }
  .shots { position: absolute; right: 70px; top: 150px; display: flex; gap: 16px; transform: rotate(-6deg); }
  .shots img { width: 150px; border-radius: 20px; box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 30px 60px rgba(0,0,0,.6); }
  .shots img:nth-child(2) { margin-top: 40px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="shots">
    <img src="../assets/img/projects/ticket-wallet/ticket-wallet-5.webp" alt="">
    <img src="../assets/img/projects/ticket-wallet/ticket-wallet-1.webp" alt="">
  </div>
  <div class="wrap">
    <div class="brand"><span class="mark">mtb</span>Muhammad Tayyab Bahaud Din</div>
    <p class="pill"><span class="dot"></span>Available for freelance &amp; contract</p>
    <h1>Senior Flutter &amp;<br><span>AI Engineer</span></h1>
    <p class="meta"><b>iOS · Android · LLM · RAG</b></p>
  </div>
</body>
</html>
